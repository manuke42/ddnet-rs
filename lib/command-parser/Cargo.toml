[package]
name = "command-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../base" }
hiarc = { path = "../hiarc", features = ["derive"] }

anyhow = { version = "1", features = ["backtrace"] }
logos = { version = "0.15" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
