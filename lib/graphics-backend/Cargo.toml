[package]
name = "graphics-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../base" }
base-fs = { path = "../base-fs" }
base-io = { path = "../base-io" }
base-io-traits = { path = "../base-io-traits" }
cache = { path = "../cache" }
config = { path = "../config" }
graphics = { path = "../graphics" }
graphics-backend-traits = { path = "../graphics-backend-traits" }
graphics-base-traits = { path = "../graphics-base-traits" }
graphics-types = { path = "../graphics-types" }
hiarc = { path = "../hiarc", features = [
  "enable_parking_lot",
  "enable_spin",
  "enable_either",
  "enable_crossbeam",
  "enable_hashlink",
  "enable_ash",
  "enable_arc_swap",
  "enable_rustc_hash",
  "enable_rayon",
] }
math = { path = "../math" }
native = { path = "../native" }
pool = { path = "../pool" }

anyhow = { version = "1", features = ["backtrace"] }
arc-swap = "1"
ash = "0.38"
ash-window = "0.13"
atomic_enum = "0.3"
bincode = { features = ["serde"], version = "2" }
crossbeam = "0.8"
either = "1"
futures = "0.3"
libc = "0.2"
log = "0.4"
naga = { version = "27", features = ["wgsl-in", "spv-out", "glsl-out"] }
naga_oil = "0.20"
num-derive = "0.4"
num-traits = "0.2"
parking_lot = "0.12"
raw-window-handle = "0.6"
rayon = "1"
replace_with = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
thread-priority = "3"

[target.'cfg(target_os = "macos")'.dependencies]
ash-molten = { version = "0.20" }

[dev-dependencies]
base-http = { path = "../base-http" }
