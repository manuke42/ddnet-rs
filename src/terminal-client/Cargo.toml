[package]
name = "terminal-client"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "terminal-client"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
log = "0.4.28"
env_logger = "0.11.8"
clap = { version = "4.5", features = ["derive"] }

base = { path = "../../lib/base" }
base-io = { path = "../../lib/base-io" }
game-base = { path = "../../game/game-base" }
game-interface = { path = "../../game/game-interface" }
game-network = { path = "../../game/game-network" }
network = { path = "../../lib/network" }
pool = { path = "../../lib/pool" }
bincode = { version = "2.0.1", features = ["serde"] }
