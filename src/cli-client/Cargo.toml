[package]
name = "cli-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = "0.25.0"
futures = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
log = "0.4.28"
env_logger = "0.11.8"

base = { path = "../../lib/base" }
game-base = { path = "../../game/game-base" }
game-interface = { path = "../../game/game-interface" }
