[package]
name = "game-network"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../../lib/base" }
network = { path = "../../lib/network" }
pool = { path = "../../lib/pool" }

game-base = { path = "../game-base" }
game-interface = { path = "../game-interface" }

async-trait = "0.1"
bincode = { version = "2", features = ["serde"] }
log = "0.4"
serde = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
] }
